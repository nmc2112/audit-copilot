# Configuration used on Cloud Run: hosted model through an OpenAI-compatible API.
prompt_version: v1

llm:
  primary:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.5-flash-lite           # highest free-tier quota; 3.8 Flash hit 429 on free tier
    api_key_env: LLM_API_KEY       # injected from Secret Manager, never stored in the image
  fallback:                                # another model with its own capacity and quota
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-3.8-flash
    api_key_env: LLM_API_KEY
  timeout_s: 60
  max_retries: 3
  backoff_s: 2.0
  temperature: 0.0

agent:
  max_iterations: 6
  max_items_per_tool: 20
  report_max_attempts: 3

tools:
  enabled:
    - ledger_summary
    - weekend_entries
    - round_amounts
    - duplicate_entries
    - unbalanced_entries
    - late_validation
    - benford_test
