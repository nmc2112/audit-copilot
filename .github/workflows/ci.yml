name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src
      - name: Unit and integration tests (mocked LLM)
        run: pytest -v
      - name: Eval harness gate (scripted model)
        run: python evals/run_eval.py --oracle --min-tool-accuracy 1.0

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false          
          load: true
          tags: audit-copilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name api -p 8080:8080 audit-copilot:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8080/health && exit 0; sleep 2; done
          docker logs api; exit 1
